<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Cliff Scroller</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      // Set canvas to device resolution
      function resizeCanvas() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
      resizeCanvas();
      window.addEventListener("resize", () => {
        resizeCanvas();
        redraw();
      });

      // Game state
      const MIN_SEGMENTS_BETWEEN_CAVERNS = 20;
      const MAX_SEGMENTS_BETWEEN_CAVERNS = 60;
      const CAVE_OPENING_DEGREES = 20; // Opening angle in degrees

      // Cave size constraints
      const MIN_CAVE_SIZE = 150; // Minimum cave radius
      const MAX_CAVE_SIZE = 350; // Maximum cave radius
      const CAVE_JAGGEDNESS = 25; // Micro-level edge texture (0 = smooth, 20-40 recommended)

      // Cave shaft constraints
      const MIN_SHAFT_LENGTH = 100; // Minimum horizontal shaft length
      const MAX_SHAFT_LENGTH = 250; // Maximum horizontal shaft length
      const MIN_SHAFT_HEIGHT = 80; // Minimum shaft height
      const MAX_SHAFT_HEIGHT = 150; // Maximum shaft height

      // Horizontal segment width constraints (as percentage of screen width)
      const MIN_SEGMENT_WIDTH_PERCENT = 5; // Minimum width: 5% of screen
      const MAX_SEGMENT_WIDTH_PERCENT = 40; // Maximum width: 40% of screen

      const state = {
        scrollY: 0,
        scrollX: 0,
        maxWidth: 0.4,
        segmentHeight: 80,
        leftCliffs: [],
        rightCliffs: [],
        generatedUpTo: 0,
        visibleRange: { start: 0, end: 0 },
        leftSegmentsUntilCave:
          Math.floor(
            Math.random() *
              (MAX_SEGMENTS_BETWEEN_CAVERNS - MIN_SEGMENTS_BETWEEN_CAVERNS + 1)
          ) + MIN_SEGMENTS_BETWEEN_CAVERNS,
        rightSegmentsUntilCave:
          Math.floor(
            Math.random() *
              (MAX_SEGMENTS_BETWEEN_CAVERNS - MIN_SEGMENTS_BETWEEN_CAVERNS + 1)
          ) + MIN_SEGMENTS_BETWEEN_CAVERNS,
      };

      // Cliff segment structure with organic edges
      class CliffSegment {
        constructor(side, prevSegment, canvasWidth, shouldBeCave) {
          this.side = side;
          const minW = canvasWidth * (MIN_SEGMENT_WIDTH_PERCENT / 100);
          const maxW = canvasWidth * (MAX_SEGMENT_WIDTH_PERCENT / 100);

          if (!prevSegment) {
            this.y = 0;
            this.currentWidth = Math.random() * (maxW - minW) + minW;
          } else {
            this.y = prevSegment.y + prevSegment.height;
            this.currentWidth = prevSegment.endWidth;
          }

          // Create a cave if it's time for one
          if (shouldBeCave) {
            this.isCave = true;
            // Cave starts at 0 (screen edge) and ends at 0
            this.currentWidth = 0;
            this.endWidth = 0;

            // Random cave size between min and max
            this.caveRadius =
              Math.random() * (MAX_CAVE_SIZE - MIN_CAVE_SIZE) + MIN_CAVE_SIZE;

            // Random shaft dimensions
            this.shaftLength =
              Math.random() * (MAX_SHAFT_LENGTH - MIN_SHAFT_LENGTH) +
              MIN_SHAFT_LENGTH;
            this.shaftHeight =
              Math.random() * (MAX_SHAFT_HEIGHT - MIN_SHAFT_HEIGHT) +
              MIN_SHAFT_HEIGHT;

            console.log(
              `Creating ${side} cave at y=${this.y}, radius=${this.caveRadius.toFixed(0)}, shaft=${this.shaftLength.toFixed(0)}x${this.shaftHeight.toFixed(0)}`
            );

            // Height is based on the shaft height (shaft determines the segment height)
            this.height = this.shaftHeight;

            // Cave depth (shaft length + cave radius)
            this.caveDepth = this.shaftLength + this.caveRadius;
          } else {
            // Normal cliff segment
            this.isCave = false;

            // Generate organic cliff edge
            const minH = 40;
            const maxH = 120;
            this.height = Math.random() * (maxH - minH) + minH;

            // Normal behavior - stay within bounds
            const widthRange = maxW - minW;
            const lowerThird = minW + widthRange * 0.33;
            const upperThird = minW + widthRange * 0.67;

            // Determine direction based on position in range
            const moveInward =
              this.currentWidth < lowerThird
                ? true
                : this.currentWidth > upperThird
                  ? false
                  : Math.random() > 0.5;

            // Calculate end width with variation (20% of range)
            const widthChange =
              Math.random() * widthRange * 0.2 + widthRange * 0.1;
            if (moveInward) {
              this.endWidth = Math.min(maxW, this.currentWidth + widthChange);
            } else {
              this.endWidth = Math.max(minW, this.currentWidth - widthChange);
            }
          }

          // Generate path points for organic shape
          this.generatePath();
          this.generateParticles();
        }

        generatePath() {
          if (this.isCave) {
            // Generate cave path with shaft leading to circular chamber
            const steps = 30;
            this.pathPoints = [];

            // Shaft rectangle connects main passage (width=0) to cave entrance
            const shaftTop = this.y;
            const shaftBottom = this.y + this.shaftHeight;
            const shaftEnd = -this.shaftLength; // Negative = extends into screen

            // Start at top of shaft opening (at screen edge, width = 0)
            this.pathPoints.push({ y: shaftTop, width: 0 });

            // Top edge of shaft - horizontal line to cave entrance
            this.pathPoints.push({ y: shaftTop, width: shaftEnd });

            // Now generate the circular cave at the end of the shaft
            const centerY = this.y + this.shaftHeight / 2;
            const centerX = -this.caveDepth; // Center is shaft length + radius into screen

            // Opening angle (where cave connects to shaft)
            const openingRadians = (CAVE_OPENING_DEGREES * Math.PI) / 180;
            const halfOpening = openingRadians / 2;

            // Start at top of cave opening (where shaft meets cave)
            const startAngle = halfOpening;
            const endAngle = 2 * Math.PI - halfOpening;
            const angleRange = endAngle - startAngle;

            // Top connection point between shaft and cave
            const topCaveY = centerY + Math.sin(halfOpening) * this.caveRadius;
            this.pathPoints.push({ y: topCaveY, width: shaftEnd });

            // Pre-generate random macro variations for this cave (cheap, done once)
            const macroVariations = [];
            for (let i = 0; i < 8; i++) {
              macroVariations.push((Math.random() - 0.5) * 2);
            }

            // Generate points around the back of the cave
            for (let i = 1; i < steps; i++) {
              const t = i / steps;
              const angle = startAngle + t * angleRange;

              // MACRO VARIATION: Deform the overall circle shape using low-frequency noise
              // Use pre-generated random values interpolated smoothly
              const macroIndex = t * (macroVariations.length - 1);
              const macroIdx1 = Math.floor(macroIndex);
              const macroIdx2 = Math.min(
                macroIdx1 + 1,
                macroVariations.length - 1
              );
              const macroBlend = macroIndex - macroIdx1;
              const macroNoise =
                macroVariations[macroIdx1] * (1 - macroBlend) +
                macroVariations[macroIdx2] * macroBlend;

              // Apply macro deformation (bulges and indents in overall shape)
              // Increase to 40% for more dramatic shape variation
              const macroDeform = macroNoise * this.caveRadius * 0.4;

              // Calculate base position with macro deformation
              const radiusWithMacro = this.caveRadius + macroDeform;
              const y = centerY + Math.sin(angle) * radiusWithMacro;
              const circleX = Math.cos(angle);
              const width = centerX + circleX * radiusWithMacro;

              // MICRO VARIATION: Rocky texture with sharp edges
              // Use triangle wave (abs of sine) for sharper, more angular features
              const freq1 = Math.abs(Math.sin(t * Math.PI * 17 + this.y * 0.2));
              const freq2 = Math.abs(
                Math.sin(t * Math.PI * 29 + this.y * 0.35)
              );
              const freq3 = Math.abs(Math.sin(t * Math.PI * 41 + this.y * 0.5));

              // Combine with different weights for rocky appearance
              const microNoise =
                freq1 * CAVE_JAGGEDNESS * 0.8 +
                freq2 * CAVE_JAGGEDNESS * 0.6 +
                freq3 * CAVE_JAGGEDNESS * 0.4;

              // Add occasional sharp protrusions
              const sharpEdge =
                i % 3 === 0
                  ? Math.abs(Math.sin(i * 7.3 + this.y)) * CAVE_JAGGEDNESS * 0.7
                  : 0;

              this.pathPoints.push({
                y,
                width: width + microNoise + sharpEdge,
              });
            }

            // Bottom connection point between cave and shaft
            const bottomCaveY =
              centerY + Math.sin(-halfOpening) * this.caveRadius;
            this.pathPoints.push({ y: bottomCaveY, width: shaftEnd });

            // Bottom edge of shaft - horizontal line back to main passage
            this.pathPoints.push({ y: shaftBottom, width: shaftEnd });

            // Close shaft at screen edge
            this.pathPoints.push({ y: shaftBottom, width: 0 });
          } else {
            // Normal cliff path
            const steps = 15;
            this.pathPoints = [];

            // First point connects exactly to the starting width
            this.pathPoints.push({ y: this.y, width: this.currentWidth });

            // Middle points have organic variation - more subtle and rounded
            for (let i = 1; i < steps; i++) {
              const t = i / steps;
              const y = this.y + t * this.height;
              const baseWidth =
                this.currentWidth + (this.endWidth - this.currentWidth) * t;

              // Smoother, more subtle noise for rounded edges
              const noise =
                Math.sin(t * Math.PI * 2 + this.y * 0.03) * 4 +
                Math.sin(t * Math.PI * 4 + this.y * 0.07) * 2 +
                Math.sin(t * Math.PI * 6 + this.y * 0.12) * 1;

              const width = baseWidth + noise;
              this.pathPoints.push({ y, width });
            }

            // Last point connects exactly to the ending width
            this.pathPoints.push({
              y: this.y + this.height,
              width: this.endWidth,
            });
          }
        }

        generateParticles() {
          this.particles = [];
          const particleDensity = this.height / 3;

          // Main particles with exponential distribution toward edge
          for (let i = 0; i < particleDensity; i++) {
            const t = Math.random();
            const pointIdx = Math.floor(t * (this.pathPoints.length - 1));
            const point = this.pathPoints[pointIdx];

            // Exponential distribution - most particles close to edge
            const distFromEdge = Math.pow(Math.random(), 3) * 80;
            const offsetX = -(distFromEdge + 5);
            const offsetY = (Math.random() - 0.5) * 10;
            const size = Math.floor(Math.random() * 2) + 1;

            this.particles.push({
              x: offsetX,
              y: point.y + offsetY,
              width: point.width,
              size,
            });
          }

          // Extra dense particles right at the edge
          const edgeParticles = this.height / 2;
          for (let i = 0; i < edgeParticles; i++) {
            const t = Math.random();
            const pointIdx = Math.floor(t * (this.pathPoints.length - 1));
            const point = this.pathPoints[pointIdx];

            // Very close to edge (0-15 pixels)
            const offsetX = -(Math.random() * 15);
            const offsetY = (Math.random() - 0.5) * 6;
            const size = Math.floor(Math.random() * 2) + 1;

            this.particles.push({
              x: offsetX,
              y: point.y + offsetY,
              width: point.width,
              size,
            });
          }
        }

        draw(ctx, canvasWidth, scrollY, scrollX, forceVisible = false) {
          const h = canvas.height / window.devicePixelRatio;

          // Only draw if visible or forced
          if (
            !forceVisible &&
            (this.y + this.height < scrollY - 50 || this.y > scrollY + h + 50)
          )
            return;

          ctx.strokeStyle = "#ffffff";
          ctx.fillStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          if (this.isCave) {
            // For caves, draw shaft edges separately (only top and bottom horizontal lines)
            // Top shaft edge
            const shaftTop = this.pathPoints[0];
            const shaftTopEnd = this.pathPoints[1];
            const topY = shaftTop.y - scrollY;

            ctx.beginPath();
            if (this.side === "left") {
              ctx.moveTo(shaftTop.width - scrollX, topY);
              ctx.lineTo(shaftTopEnd.width - scrollX, topY);
            } else {
              ctx.moveTo(canvasWidth - shaftTop.width - scrollX, topY);
              ctx.lineTo(canvasWidth - shaftTopEnd.width - scrollX, topY);
            }
            ctx.stroke();

            // Draw the circular cave portion (skip first 2 shaft points, last 2 shaft points)
            ctx.beginPath();
            for (let i = 2; i < this.pathPoints.length - 2; i++) {
              const point = this.pathPoints[i];
              const screenY = point.y - scrollY;
              const x =
                this.side === "left"
                  ? point.width - scrollX
                  : canvasWidth - point.width - scrollX;

              if (i === 2) {
                ctx.moveTo(x, screenY);
              } else {
                ctx.lineTo(x, screenY);
              }
            }
            ctx.stroke();

            // Bottom shaft edge
            const shaftBottomEnd = this.pathPoints[this.pathPoints.length - 2];
            const shaftBottom = this.pathPoints[this.pathPoints.length - 1];
            const bottomY = shaftBottom.y - scrollY;

            ctx.beginPath();
            if (this.side === "left") {
              ctx.moveTo(shaftBottomEnd.width - scrollX, bottomY);
              ctx.lineTo(shaftBottom.width - scrollX, bottomY);
            } else {
              ctx.moveTo(canvasWidth - shaftBottomEnd.width - scrollX, bottomY);
              ctx.lineTo(canvasWidth - shaftBottom.width - scrollX, bottomY);
            }
            ctx.stroke();
          } else {
            // Normal cliff - draw as continuous path
            ctx.beginPath();

            for (let i = 0; i < this.pathPoints.length; i++) {
              const point = this.pathPoints[i];
              const screenY = point.y - scrollY;

              if (this.side === "left") {
                const x = point.width - scrollX;
                if (i === 0) {
                  ctx.moveTo(-scrollX, screenY);
                  ctx.lineTo(x, screenY);
                } else {
                  ctx.lineTo(x, screenY);
                }
              } else {
                const x = canvasWidth - point.width - scrollX;
                if (i === 0) {
                  ctx.moveTo(canvasWidth - scrollX, screenY);
                  ctx.lineTo(x, screenY);
                } else {
                  ctx.lineTo(x, screenY);
                }
              }
            }

            ctx.stroke();
          }

          // Draw particles as squares (8-bit style)
          for (const p of this.particles) {
            const screenY = p.y - scrollY;
            if (screenY < -10 || screenY > h + 10) continue;

            const x =
              this.side === "left"
                ? p.width + p.x - scrollX
                : canvasWidth - p.width - p.x - scrollX;

            // Draw square instead of circle for 8-bit aesthetic
            ctx.fillRect(x - p.size / 2, screenY - p.size / 2, p.size, p.size);
          }
        }
      }

      // Generate initial cliffs
      function generateInitialCliffs() {
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        const numSegments = Math.ceil(h / state.segmentHeight) + 5;

        state.leftCliffs = [];
        state.rightCliffs = [];

        for (let i = 0; i < numSegments; i++) {
          const prevLeft = state.leftCliffs[i - 1];
          const prevRight = state.rightCliffs[i - 1];

          // Decrement counters
          state.leftSegmentsUntilCave--;
          state.rightSegmentsUntilCave--;

          // Check if it's time for a cave (exactly 0, not <= 0)
          const leftShouldBeCave = state.leftSegmentsUntilCave === 0;
          const rightShouldBeCave = state.rightSegmentsUntilCave === 0;

          // If we need a cave, first create a transition segment to width 0
          let leftPrev = prevLeft;
          let rightPrev = prevRight;
          let needsLeftTransition =
            leftShouldBeCave && prevLeft && prevLeft.endWidth > 0;
          let needsRightTransition =
            rightShouldBeCave && prevRight && prevRight.endWidth > 0;

          if (needsLeftTransition) {
            // Create transition segment from current width to 0
            const transition = new CliffSegment("left", prevLeft, w, false);
            transition.endWidth = 0; // Force end at 0
            transition.generatePath();
            transition.generateParticles();
            state.leftCliffs.push(transition);
            leftPrev = transition;
          }

          if (needsRightTransition) {
            // Create transition segment from current width to 0
            const transition = new CliffSegment("right", prevRight, w, false);
            transition.endWidth = 0; // Force end at 0
            transition.generatePath();
            transition.generateParticles();
            state.rightCliffs.push(transition);
            rightPrev = transition;
          }

          // Keep arrays in sync - if one side added a transition, add a normal segment to the other
          if (needsLeftTransition && !needsRightTransition) {
            const normalSegment = new CliffSegment(
              "right",
              prevRight,
              w,
              false
            );
            state.rightCliffs.push(normalSegment);
            rightPrev = normalSegment;
          } else if (needsRightTransition && !needsLeftTransition) {
            const normalSegment = new CliffSegment("left", prevLeft, w, false);
            state.leftCliffs.push(normalSegment);
            leftPrev = normalSegment;
          }

          const newLeft = new CliffSegment(
            "left",
            leftPrev,
            w,
            leftShouldBeCave
          );
          const newRight = new CliffSegment(
            "right",
            rightPrev,
            w,
            rightShouldBeCave
          );

          state.leftCliffs.push(newLeft);
          state.rightCliffs.push(newRight);

          // Reset counter after attempting cave (whether successful or not)
          if (leftShouldBeCave) {
            state.leftSegmentsUntilCave =
              Math.floor(
                Math.random() *
                  (MAX_SEGMENTS_BETWEEN_CAVERNS -
                    MIN_SEGMENTS_BETWEEN_CAVERNS +
                    1)
              ) + MIN_SEGMENTS_BETWEEN_CAVERNS;
            console.log(
              `Left cave attempt at segment ${i}. isCave=${newLeft.isCave}. Next cave in ${state.leftSegmentsUntilCave} segments`
            );
          }

          if (rightShouldBeCave) {
            state.rightSegmentsUntilCave =
              Math.floor(
                Math.random() *
                  (MAX_SEGMENTS_BETWEEN_CAVERNS -
                    MIN_SEGMENTS_BETWEEN_CAVERNS +
                    1)
              ) + MIN_SEGMENTS_BETWEEN_CAVERNS;
            console.log(
              `Right cave attempt at segment ${i}. isCave=${newRight.isCave}. Next cave in ${state.rightSegmentsUntilCave} segments`
            );
          }
        }

        // Track how far we've generated
        if (state.leftCliffs.length > 0) {
          state.generatedUpTo =
            state.leftCliffs[state.leftCliffs.length - 1].y +
            state.leftCliffs[state.leftCliffs.length - 1].height;
        }
      }

      // Calculate allowed horizontal scroll range based on visible caverns
      function calculateScrollXLimits() {
        const h = canvas.height / window.devicePixelRatio;
        const visibleStart = state.scrollY;
        const visibleEnd = state.scrollY + h;

        let maxLeftCaveDepth = 0; // How far left caves extend (negative values)
        let maxRightCaveDepth = 0; // How far right caves extend (negative values)
        let hasCaverns = false;

        // Check all visible segments for caves
        for (const cliff of state.leftCliffs) {
          if (
            cliff.isCave &&
            cliff.y + cliff.height >= visibleStart &&
            cliff.y <= visibleEnd
          ) {
            hasCaverns = true;
            // Find the maximum negative width (deepest point into cave)
            for (const point of cliff.pathPoints) {
              if (point.width < maxLeftCaveDepth) {
                maxLeftCaveDepth = point.width;
              }
            }
          }
        }

        for (const cliff of state.rightCliffs) {
          if (
            cliff.isCave &&
            cliff.y + cliff.height >= visibleStart &&
            cliff.y <= visibleEnd
          ) {
            hasCaverns = true;
            // Find the maximum negative width (deepest point into cave)
            for (const point of cliff.pathPoints) {
              if (point.width < maxRightCaveDepth) {
                maxRightCaveDepth = point.width;
              }
            }
          }
        }

        // Left cave: scroll left (negative) to see it, so minX should be the cave depth
        // Right cave: scroll right (positive) to see it, so maxX should be the cave depth magnitude
        return {
          minX: maxLeftCaveDepth, // negative value - how far left we can scroll
          maxX: -maxRightCaveDepth, // positive value - how far right we can scroll
          hasCaverns,
        };
      }
      function generateAhead() {
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;

        // Generate 2 screens ahead to prevent pop-in
        const bufferDistance = h * 2;

        // Generate forward - data is kept forever
        while (state.generatedUpTo < state.scrollY + h + bufferDistance) {
          const prevLeft = state.leftCliffs[state.leftCliffs.length - 1];
          const prevRight = state.rightCliffs[state.rightCliffs.length - 1];

          // Decrement counters
          state.leftSegmentsUntilCave--;
          state.rightSegmentsUntilCave--;

          // Check if it's time for a cave (exactly 0, not <= 0)
          const leftShouldBeCave = state.leftSegmentsUntilCave === 0;
          const rightShouldBeCave = state.rightSegmentsUntilCave === 0;

          if (leftShouldBeCave || rightShouldBeCave) {
            console.log(
              `generateAhead: L=${leftShouldBeCave} (counter=${state.leftSegmentsUntilCave}), R=${rightShouldBeCave} (counter=${state.rightSegmentsUntilCave})`
            );
          }

          // If we need a cave, first create a transition segment to width 0
          let leftPrev = prevLeft;
          let rightPrev = prevRight;
          let needsLeftTransition = leftShouldBeCave && prevLeft.endWidth > 0;
          let needsRightTransition =
            rightShouldBeCave && prevRight.endWidth > 0;

          if (needsLeftTransition) {
            // Create transition segment from current width to 0
            const transition = new CliffSegment("left", prevLeft, w, false);
            transition.endWidth = 0; // Force end at 0
            transition.generatePath();
            transition.generateParticles();
            state.leftCliffs.push(transition);
            leftPrev = transition;
            state.generatedUpTo = transition.y + transition.height;
          }

          if (needsRightTransition) {
            // Create transition segment from current width to 0
            const transition = new CliffSegment("right", prevRight, w, false);
            transition.endWidth = 0; // Force end at 0
            transition.generatePath();
            transition.generateParticles();
            state.rightCliffs.push(transition);
            rightPrev = transition;
            state.generatedUpTo = transition.y + transition.height;
          }

          // Keep arrays in sync - if one side added a transition, add a normal segment to the other
          if (needsLeftTransition && !needsRightTransition) {
            const normalSegment = new CliffSegment(
              "right",
              prevRight,
              w,
              false
            );
            state.rightCliffs.push(normalSegment);
            rightPrev = normalSegment;
            state.generatedUpTo = normalSegment.y + normalSegment.height;
          } else if (needsRightTransition && !needsLeftTransition) {
            const normalSegment = new CliffSegment("left", prevLeft, w, false);
            state.leftCliffs.push(normalSegment);
            leftPrev = normalSegment;
            state.generatedUpTo = normalSegment.y + normalSegment.height;
          }

          const newLeft = new CliffSegment(
            "left",
            leftPrev,
            w,
            leftShouldBeCave
          );
          const newRight = new CliffSegment(
            "right",
            rightPrev,
            w,
            rightShouldBeCave
          );

          state.leftCliffs.push(newLeft);
          state.rightCliffs.push(newRight);

          // Reset counter immediately after creating cave
          if (leftShouldBeCave) {
            const newCount =
              Math.floor(
                Math.random() *
                  (MAX_SEGMENTS_BETWEEN_CAVERNS -
                    MIN_SEGMENTS_BETWEEN_CAVERNS +
                    1)
              ) + MIN_SEGMENTS_BETWEEN_CAVERNS;
            state.leftSegmentsUntilCave = newCount;
            console.log(`Left cave created, next in ${newCount} segments`);
          }

          if (rightShouldBeCave) {
            const newCount =
              Math.floor(
                Math.random() *
                  (MAX_SEGMENTS_BETWEEN_CAVERNS -
                    MIN_SEGMENTS_BETWEEN_CAVERNS +
                    1)
              ) + MIN_SEGMENTS_BETWEEN_CAVERNS;
            state.rightSegmentsUntilCave = newCount;
            console.log(`Right cave created, next in ${newCount} segments`);
          }

          state.generatedUpTo = newLeft.y + newLeft.height;
        }

        // Update visible range for drawing (2 screens buffer on each side)
        state.visibleRange.start = Math.max(0, state.scrollY - h * 2);
        state.visibleRange.end = state.scrollY + h * 3;
      }

      // Find the index range of cliffs that should be drawn
      function getVisibleCliffIndices() {
        let startIdx = 0;
        let endIdx = state.leftCliffs.length;

        // Binary search for start index (first cliff that ends after visible start)
        for (let i = 0; i < state.leftCliffs.length; i++) {
          if (
            state.leftCliffs[i].y + state.leftCliffs[i].height >=
            state.visibleRange.start
          ) {
            startIdx = i;
            break;
          }
        }

        // Linear search from start for end index (first cliff that starts after visible end)
        for (let i = startIdx; i < state.leftCliffs.length; i++) {
          if (state.leftCliffs[i].y > state.visibleRange.end) {
            endIdx = i;
            break;
          }
        }

        return { startIdx, endIdx };
      }

      // Draw everything
      function redraw() {
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;

        // Clear with black
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, w, h);

        // Get the range of cliffs that should be drawn
        const { startIdx, endIdx } = getVisibleCliffIndices();

        // Only draw cliffs within visible range
        for (let i = startIdx; i < endIdx; i++) {
          state.leftCliffs[i].draw(ctx, w, state.scrollY, state.scrollX);
          state.rightCliffs[i].draw(ctx, w, state.scrollY, state.scrollX);
        }
      }

      // Touch handling
      let touchStartY = 0;
      let touchStartX = 0;
      let scrollStartY = 0;
      let scrollStartX = 0;

      canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
        scrollStartY = state.scrollY;
        scrollStartX = state.scrollX;
      });

      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const touchY = e.touches[0].clientY;
        const touchX = e.touches[0].clientX;
        const deltaY = touchStartY - touchY;
        const deltaX = touchStartX - touchX;

        // Update vertical scroll
        state.scrollY = Math.max(0, scrollStartY + deltaY);

        // Calculate horizontal scroll limits based on visible caverns
        const limits = calculateScrollXLimits();

        if (limits.hasCaverns) {
          // Allow horizontal scrolling within cave limits
          const newScrollX = scrollStartX + deltaX;
          state.scrollX = Math.max(
            limits.minX,
            Math.min(limits.maxX, newScrollX)
          );
        } else {
          // No caverns visible - lock to center
          state.scrollX = 0;
        }

        generateAhead();
        redraw();
      });

      // Mouse handling for desktop testing
      let mouseDown = false;
      let mouseStartY = 0;
      let mouseStartX = 0;

      canvas.addEventListener("mousedown", (e) => {
        mouseDown = true;
        mouseStartY = e.clientY;
        mouseStartX = e.clientX;
        scrollStartY = state.scrollY;
        scrollStartX = state.scrollX;
      });

      canvas.addEventListener("mousemove", (e) => {
        if (!mouseDown) return;
        const deltaY = mouseStartY - e.clientY;
        const deltaX = mouseStartX - e.clientX;

        // Update vertical scroll
        state.scrollY = Math.max(0, scrollStartY + deltaY);

        // Calculate horizontal scroll limits based on visible caverns
        const limits = calculateScrollXLimits();

        if (limits.hasCaverns) {
          // Allow horizontal scrolling within cave limits
          const newScrollX = scrollStartX + deltaX;
          state.scrollX = Math.max(
            limits.minX,
            Math.min(limits.maxX, newScrollX)
          );
        } else {
          // No caverns visible - lock to center
          state.scrollX = 0;
        }

        generateAhead();
        redraw();
      });

      canvas.addEventListener("mouseup", () => {
        mouseDown = false;
      });

      canvas.addEventListener("mouseleave", () => {
        mouseDown = false;
      });

      // Initialize - generate ahead first so cliffs are visible
      generateInitialCliffs();
      generateAhead();
      redraw();
    </script>
  </body>
</html>
