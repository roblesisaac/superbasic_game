<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-Bit Maze Game</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #000;
        font-family: "Courier New", monospace;
        color: #fff;
        overflow: hidden;
      }
      #gameContainer {
        text-align: center;
        width: 100%;
        max-width: 100vw;
        position: relative;
        z-index: 5;
        pointer-events: none;
      }
      canvas {
        border: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        margin: 0 auto;
      }
      #touchArea {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        z-index: 1;
      }
      #joystickOuter {
        position: fixed;
        width: 80px;
        height: 80px;
        border: 3px solid #fff;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.1s;
        pointer-events: none;
        z-index: 10;
      }
      #joystickInner {
        position: fixed;
        width: 35px;
        height: 35px;
        background-color: #fff;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.1s;
        pointer-events: none;
        z-index: 11;
      }
      #menuButton {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background-color: #fff;
        border: 2px solid #fff;
        border-radius: 50%;
        cursor: pointer;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #000;
      }
      #menuButton:active {
        background-color: #ccc;
      }
      #menuPanel {
        position: fixed;
        top: 0;
        right: -300px;
        width: 280px;
        height: 100%;
        background-color: #000;
        border-left: 2px solid #fff;
        padding: 80px 20px 20px 20px;
        transition: right 0.3s;
        z-index: 99;
        overflow-y: auto;
      }
      #menuPanel.open {
        right: 0;
      }
      #menuOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 98;
      }
      #menuOverlay.open {
        opacity: 1;
        pointer-events: auto;
      }
      button {
        background-color: #fff;
        color: #000;
        border: none;
        padding: 12px 24px;
        font-family: "Courier New", monospace;
        font-size: 14px;
        cursor: pointer;
        margin: 10px 0;
        width: 100%;
        pointer-events: auto;
      }
      button:active {
        background-color: #ccc;
      }
      .difficulty-container {
        margin-top: 15px;
      }
      input[type="number"] {
        background-color: #fff;
        color: #000;
        border: 2px solid #fff;
        padding: 10px;
        font-family: "Courier New", monospace;
        font-size: 14px;
        width: 100%;
        margin: 5px 0;
        pointer-events: auto;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div id="touchArea"></div>
    <div id="joystickOuter"></div>
    <div id="joystickInner"></div>

    <div id="menuButton" onclick="toggleMenu()">☰</div>
    <div id="menuOverlay" onclick="toggleMenu()"></div>
    <div id="menuPanel">
      <button onclick="generateNewMaze(); toggleMenu();">
        Generate New Maze
      </button>
      <div class="difficulty-container">
        <label for="difficulty">Maze Size (10-100):</label>
        <input
          type="number"
          id="difficulty"
          min="10"
          max="100"
          value="25"
          onchange="updateDifficulty()"
        />
      </div>
      <div class="difficulty-container">
        <label for="zoom">Zoom (0-100%):</label>
        <input
          type="number"
          id="zoom"
          min="0"
          max="100"
          value="100"
          onchange="updateZoom()"
        />
      </div>
    </div>

    <div id="gameContainer">
      <canvas id="mazeCanvas"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("mazeCanvas");
      const ctx = canvas.getContext("2d");

      // Disable image smoothing for crisp pixel rendering
      ctx.imageSmoothingEnabled = false;
      ctx.webkitImageSmoothingEnabled = false;
      ctx.mozImageSmoothingEnabled = false;
      ctx.msImageSmoothingEnabled = false;

      // Offscreen canvas for pre-rendering the entire maze
      let offscreenCanvas = null;
      let offscreenCtx = null;

      // Phone-optimized settings
      const SPRITE_SIZE = 25; // Fixed 25px sprite
      const PHONE_WIDTH = Math.min(window.innerWidth, 375); // Typical phone width
      const PASSAGE_WIDTH = PHONE_WIDTH; // Passageways are phone-screen-width
      const WALL_THICKNESS = PHONE_WIDTH; // Walls are also phone-screen-width
      const CELL_SIZE = PASSAGE_WIDTH + WALL_THICKNESS; // Cell = passage + wall

      let COLS = 25;
      let ROWS = 25;
      let ZOOM = 1.0; // 100% zoom by default
      let camera = { x: 0, y: 0 };
      let targetCamera = { x: 0, y: 0 };
      const CAMERA_SMOOTHNESS = 0.15;

      function updateCanvasSize() {
        canvas.width = Math.min(window.innerWidth, 480);
        canvas.height = window.innerHeight;
      }

      function updateCamera() {
        const viewportWidth = canvas.width;
        const viewportHeight = canvas.height;

        // Camera works in world space (not zoomed)
        // Center camera on player position
        targetCamera.x = player.x - viewportWidth / (2 * ZOOM);
        targetCamera.y = player.y - viewportHeight / (2 * ZOOM);

        const mazeWidth = COLS * CELL_SIZE;
        const mazeHeight = ROWS * CELL_SIZE;

        // Clamp camera to maze bounds (in world space)
        targetCamera.x = Math.max(
          0,
          Math.min(targetCamera.x, mazeWidth - viewportWidth / ZOOM)
        );
        targetCamera.y = Math.max(
          0,
          Math.min(targetCamera.y, mazeHeight - viewportHeight / ZOOM)
        );

        // Center if maze is smaller than viewport
        if (mazeWidth < viewportWidth / ZOOM)
          targetCamera.x = -(viewportWidth / ZOOM - mazeWidth) / 2;
        if (mazeHeight < viewportHeight / ZOOM)
          targetCamera.y = -(viewportHeight / ZOOM - mazeHeight) / 2;

        camera.x += (targetCamera.x - camera.x) * CAMERA_SMOOTHNESS;
        camera.y += (targetCamera.y - camera.y) * CAMERA_SMOOTHNESS;
      }

      let maze = [];
      let player = { x: CELL_SIZE / 2, y: CELL_SIZE / 2 };
      let playerVelocity = { x: 0, y: 0 };
      let goal = { x: 0, y: 0 };
      const PLAYER_SPEED = 10;

      class Cell {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.walls = { top: true, right: true, bottom: true, left: true };
          this.visited = false;
        }
      }

      function initMaze() {
        maze = [];
        for (let y = 0; y < ROWS; y++) {
          maze[y] = [];
          for (let x = 0; x < COLS; x++) {
            maze[y][x] = new Cell(x, y);
          }
        }
      }

      function generateMaze(x, y) {
        const current = maze[y][x];
        current.visited = true;

        const directions = [
          { dx: 0, dy: -1, wall: "top", opposite: "bottom" },
          { dx: 1, dy: 0, wall: "right", opposite: "left" },
          { dx: 0, dy: 1, wall: "bottom", opposite: "top" },
          { dx: -1, dy: 0, wall: "left", opposite: "right" },
        ];

        for (let i = directions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [directions[i], directions[j]] = [directions[j], directions[i]];
        }

        for (const dir of directions) {
          const nx = x + dir.dx;
          const ny = y + dir.dy;

          if (
            nx >= 0 &&
            nx < COLS &&
            ny >= 0 &&
            ny < ROWS &&
            !maze[ny][nx].visited
          ) {
            current.walls[dir.wall] = false;
            maze[ny][nx].walls[dir.opposite] = false;
            generateMaze(nx, ny);
          }
        }
      }

      function checkCollision(newX, newY) {
        const spriteLeft = newX - SPRITE_SIZE / 2;
        const spriteRight = newX + SPRITE_SIZE / 2;
        const spriteTop = newY - SPRITE_SIZE / 2;
        const spriteBottom = newY + SPRITE_SIZE / 2;

        const halfWall = WALL_THICKNESS / 2;

        // Check all cells that the sprite might overlap
        const minGridX = Math.max(
          0,
          Math.floor((spriteLeft - halfWall) / CELL_SIZE)
        );
        const maxGridX = Math.min(
          COLS - 1,
          Math.floor((spriteRight + halfWall) / CELL_SIZE)
        );
        const minGridY = Math.max(
          0,
          Math.floor((spriteTop - halfWall) / CELL_SIZE)
        );
        const maxGridY = Math.min(
          ROWS - 1,
          Math.floor((spriteBottom + halfWall) / CELL_SIZE)
        );

        for (let gridY = minGridY; gridY <= maxGridY; gridY++) {
          for (let gridX = minGridX; gridX <= maxGridX; gridX++) {
            const cell = maze[gridY][gridX];
            const cellLeft = gridX * CELL_SIZE;
            const cellTop = gridY * CELL_SIZE;
            const cellRight = cellLeft + CELL_SIZE;
            const cellBottom = cellTop + CELL_SIZE;

            // Check top wall (extends from left-halfWall to right+halfWall)
            if (cell.walls.top) {
              const wallLeft = cellLeft - halfWall;
              const wallRight = cellRight + halfWall;
              const wallTop = cellTop - halfWall;
              const wallBottom = cellTop + halfWall;

              if (
                spriteRight > wallLeft &&
                spriteLeft < wallRight &&
                spriteBottom > wallTop &&
                spriteTop < wallBottom
              ) {
                return true;
              }
            }

            // Check bottom wall (extends from left-halfWall to right+halfWall)
            if (cell.walls.bottom) {
              const wallLeft = cellLeft - halfWall;
              const wallRight = cellRight + halfWall;
              const wallTop = cellBottom - halfWall;
              const wallBottom = cellBottom + halfWall;

              if (
                spriteRight > wallLeft &&
                spriteLeft < wallRight &&
                spriteBottom > wallTop &&
                spriteTop < wallBottom
              ) {
                return true;
              }
            }

            // Check left wall (extends from top-halfWall to bottom+halfWall)
            if (cell.walls.left) {
              const wallLeft = cellLeft - halfWall;
              const wallRight = cellLeft + halfWall;
              const wallTop = cellTop - halfWall;
              const wallBottom = cellBottom + halfWall;

              if (
                spriteRight > wallLeft &&
                spriteLeft < wallRight &&
                spriteBottom > wallTop &&
                spriteTop < wallBottom
              ) {
                return true;
              }
            }

            // Check right wall (extends from top-halfWall to bottom+halfWall)
            if (cell.walls.right) {
              const wallLeft = cellRight - halfWall;
              const wallRight = cellRight + halfWall;
              const wallTop = cellTop - halfWall;
              const wallBottom = cellBottom + halfWall;

              if (
                spriteRight > wallLeft &&
                spriteLeft < wallRight &&
                spriteBottom > wallTop &&
                spriteTop < wallBottom
              ) {
                return true;
              }
            }
          }
        }

        return false;
      }

      function renderMazeToOffscreenCanvas() {
        // Create offscreen canvas at full maze size
        const mazeWidth = COLS * CELL_SIZE;
        const mazeHeight = ROWS * CELL_SIZE;

        offscreenCanvas = document.createElement("canvas");
        offscreenCanvas.width = mazeWidth;
        offscreenCanvas.height = mazeHeight;
        offscreenCtx = offscreenCanvas.getContext("2d");

        // Disable image smoothing on offscreen canvas too
        offscreenCtx.imageSmoothingEnabled = false;
        offscreenCtx.webkitImageSmoothingEnabled = false;
        offscreenCtx.mozImageSmoothingEnabled = false;
        offscreenCtx.msImageSmoothingEnabled = false;

        // Fill background
        offscreenCtx.fillStyle = "#000";
        offscreenCtx.fillRect(0, 0, mazeWidth, mazeHeight);

        // Draw all walls
        offscreenCtx.fillStyle = "#fff";
        const halfWall = WALL_THICKNESS / 2;

        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const cell = maze[y][x];
            const px = x * CELL_SIZE;
            const py = y * CELL_SIZE;

            // Draw top wall as rectangle
            if (cell.walls.top) {
              offscreenCtx.fillRect(
                px - halfWall,
                py - halfWall,
                CELL_SIZE + WALL_THICKNESS,
                WALL_THICKNESS
              );
            }
            // Draw bottom wall as rectangle
            if (cell.walls.bottom) {
              offscreenCtx.fillRect(
                px - halfWall,
                py + CELL_SIZE - halfWall,
                CELL_SIZE + WALL_THICKNESS,
                WALL_THICKNESS
              );
            }
            // Draw left wall as rectangle
            if (cell.walls.left) {
              offscreenCtx.fillRect(
                px - halfWall,
                py - halfWall,
                WALL_THICKNESS,
                CELL_SIZE + WALL_THICKNESS
              );
            }
            // Draw right wall as rectangle
            if (cell.walls.right) {
              offscreenCtx.fillRect(
                px + CELL_SIZE - halfWall,
                py - halfWall,
                WALL_THICKNESS,
                CELL_SIZE + WALL_THICKNESS
              );
            }
          }
        }
      }

      function drawMaze() {
        // Clear screen
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        const halfWall = WALL_THICKNESS / 2;

        // Calculate visible cell range with padding for wall thickness
        // Camera is in world space, so we need to figure out which cells are visible
        const worldLeft = camera.x;
        const worldRight = camera.x + canvas.width / ZOOM;
        const worldTop = camera.y;
        const worldBottom = camera.y + canvas.height / ZOOM;

        // Add padding for wall thickness (walls extend beyond cell boundaries)
        const padding = WALL_THICKNESS;
        
        // Convert to cell indices
        const startCol = Math.max(0, Math.floor((worldLeft - padding) / CELL_SIZE));
        const endCol = Math.min(COLS - 1, Math.ceil((worldRight + padding) / CELL_SIZE));
        const startRow = Math.max(0, Math.floor((worldTop - padding) / CELL_SIZE));
        const endRow = Math.min(ROWS - 1, Math.ceil((worldBottom + padding) / CELL_SIZE));

        // Only draw visible cells
        for (let y = startRow; y <= endRow; y++) {
          for (let x = startCol; x <= endCol; x++) {
            const cell = maze[y][x];
            // Convert world space to screen space
            const px = (x * CELL_SIZE - camera.x) * ZOOM;
            const py = (y * CELL_SIZE - camera.y) * ZOOM;
            const scaledCellSize = CELL_SIZE * ZOOM;
            const scaledHalfWall = halfWall * ZOOM;
            const scaledWallThickness = WALL_THICKNESS * ZOOM;

            // Draw top wall
            if (cell.walls.top) {
              ctx.fillRect(
                px - scaledHalfWall,
                py - scaledHalfWall,
                scaledCellSize + scaledWallThickness,
                scaledWallThickness
              );
            }
            // Draw bottom wall
            if (cell.walls.bottom) {
              ctx.fillRect(
                px - scaledHalfWall,
                py + scaledCellSize - scaledHalfWall,
                scaledCellSize + scaledWallThickness,
                scaledWallThickness
              );
            }
            // Draw left wall
            if (cell.walls.left) {
              ctx.fillRect(
                px - scaledHalfWall,
                py - scaledHalfWall,
                scaledWallThickness,
                scaledCellSize + scaledWallThickness
              );
            }
            // Draw right wall
            if (cell.walls.right) {
              ctx.fillRect(
                px + scaledCellSize - scaledHalfWall,
                py - scaledHalfWall,
                scaledWallThickness,
                scaledCellSize + scaledWallThickness
              );
            }
          }
        }
      }

      function drawPlayer() {
        ctx.fillStyle = "#fff";
        // Convert world space to screen space
        const px = (player.x - camera.x) * ZOOM;
        const py = (player.y - camera.y) * ZOOM;
        const scaledSpriteSize = SPRITE_SIZE * ZOOM;
        ctx.fillRect(
          px - scaledSpriteSize / 2,
          py - scaledSpriteSize / 2,
          scaledSpriteSize,
          scaledSpriteSize
        );
      }

      function drawGoal() {
        ctx.fillStyle = "#f00";
        // Convert world space to screen space
        const gx = (goal.x - camera.x) * ZOOM;
        const gy = (goal.y - camera.y) * ZOOM;
        const goalSize = SPRITE_SIZE * 1.5 * ZOOM;
        ctx.fillRect(gx - goalSize / 2, gy - goalSize / 2, goalSize, goalSize);
      }

      let gameWon = false;

      function updatePlayer() {
        if (playerVelocity.x === 0 && playerVelocity.y === 0) return;

        let newX = player.x + playerVelocity.x * PLAYER_SPEED;
        let newY = player.y + playerVelocity.y * PLAYER_SPEED;

        // Check collision for X movement
        if (!checkCollision(newX, player.y)) {
          player.x = newX;
        }

        // Check collision for Y movement
        if (!checkCollision(player.x, newY)) {
          player.y = newY;
        }

        // Check if reached goal
        if (!gameWon) {
          const distToGoal = Math.sqrt(
            Math.pow(player.x - goal.x, 2) + Math.pow(player.y - goal.y, 2)
          );

          if (distToGoal < SPRITE_SIZE * 2) {
            gameWon = true;
            setTimeout(() => {
              alert("You Win! 🎉");
              generateNewMaze();
            }, 100);
          }
        }
      }

      function render() {
        updateCamera();
        drawMaze();
        drawGoal();
        drawPlayer();
      }

      function animate() {
        updatePlayer();
        render();
        requestAnimationFrame(animate);
      }

      function generateNewMaze() {
        gameWon = false;
        updateCanvasSize();
        initMaze();
        generateMaze(0, 0);

        // Start player in center of first cell
        player = {
          x: CELL_SIZE / 2,
          y: CELL_SIZE / 2,
        };
        playerVelocity = { x: 0, y: 0 };

        // Place goal in center of last cell
        goal = {
          x: (COLS - 0.5) * CELL_SIZE,
          y: (ROWS - 0.5) * CELL_SIZE,
        };

        // Reset camera to center on player at start (in world space)
        const viewportWidth = canvas.width;
        const viewportHeight = canvas.height;

        camera.x = player.x - viewportWidth / (2 * ZOOM);
        camera.y = player.y - viewportHeight / (2 * ZOOM);
        targetCamera.x = camera.x;
        targetCamera.y = camera.y;

        render();
      }

      function updateDifficulty() {
        const input = document.getElementById("difficulty");
        let value = parseInt(input.value);
        if (value < 10) value = 10;
        if (value > 100) value = 100;
        input.value = value;
        COLS = value;
        ROWS = value;
        generateNewMaze();
      }

      function updateZoom() {
        const input = document.getElementById("zoom");
        let value = parseInt(input.value);
        if (value < 1) value = 1; // Minimum 1% to avoid division by zero
        if (value > 100) value = 100;
        input.value = value;
        ZOOM = value / 100; // Convert percentage to decimal (0.01-1)
        render();
      }

      window.addEventListener("resize", () => {
        updateCanvasSize();
        render();
      });

      // Joystick functionality
      const touchArea = document.getElementById("touchArea");
      const joystickOuter = document.getElementById("joystickOuter");
      const joystickInner = document.getElementById("joystickInner");
      const menuPanel = document.getElementById("menuPanel");
      const menuOverlay = document.getElementById("menuOverlay");

      let joystickActive = false;
      let joystickStartX = 0;
      let joystickStartY = 0;

      function toggleMenu() {
        menuPanel.classList.toggle("open");
        menuOverlay.classList.toggle("open");
      }

      function handleJoystickStart(e) {
        if (menuPanel.classList.contains("open")) return;

        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;

        joystickStartX = touch.clientX;
        joystickStartY = touch.clientY;

        joystickOuter.style.left = joystickStartX - 40 + "px";
        joystickOuter.style.top = joystickStartY - 40 + "px";
        joystickInner.style.left = joystickStartX - 17.5 + "px";
        joystickInner.style.top = joystickStartY - 17.5 + "px";

        joystickOuter.style.opacity = "1";
        joystickInner.style.opacity = "1";
        joystickActive = true;
      }

      function handleJoystickMove(e) {
        if (!joystickActive) return;
        e.preventDefault();

        const touch = e.touches ? e.touches[0] : e;

        let currentX = touch.clientX;
        let currentY = touch.clientY;

        let deltaX = currentX - joystickStartX;
        let deltaY = currentY - joystickStartY;

        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        const maxDistance = 35;

        if (distance > maxDistance) {
          const angle = Math.atan2(deltaY, deltaX);
          deltaX = Math.cos(angle) * maxDistance;
          deltaY = Math.sin(angle) * maxDistance;
        }

        joystickInner.style.left = joystickStartX + deltaX - 17.5 + "px";
        joystickInner.style.top = joystickStartY + deltaY - 17.5 + "px";

        // Set velocity based on joystick position (normalized)
        if (distance > 5) {
          playerVelocity.x = deltaX / maxDistance;
          playerVelocity.y = deltaY / maxDistance;
        } else {
          playerVelocity.x = 0;
          playerVelocity.y = 0;
        }
      }

      function handleJoystickEnd(e) {
        e.preventDefault();
        joystickActive = false;
        joystickOuter.style.opacity = "0";
        joystickInner.style.opacity = "0";
        playerVelocity.x = 0;
        playerVelocity.y = 0;
      }

      touchArea.addEventListener("touchstart", handleJoystickStart);
      touchArea.addEventListener("touchmove", handleJoystickMove);
      touchArea.addEventListener("touchend", handleJoystickEnd);
      touchArea.addEventListener("touchcancel", handleJoystickEnd);

      touchArea.addEventListener("mousedown", handleJoystickStart);
      touchArea.addEventListener("mousemove", handleJoystickMove);
      touchArea.addEventListener("mouseup", handleJoystickEnd);

      // Keyboard controls
      const keys = {};
      document.addEventListener("keydown", (e) => {
        keys[e.key] = true;

        playerVelocity.x = 0;
        playerVelocity.y = 0;

        if (keys["ArrowUp"] || keys["w"]) playerVelocity.y -= 1;
        if (keys["ArrowDown"] || keys["s"]) playerVelocity.y += 1;
        if (keys["ArrowLeft"] || keys["a"]) playerVelocity.x -= 1;
        if (keys["ArrowRight"] || keys["d"]) playerVelocity.x += 1;

        // Normalize diagonal movement
        const magnitude = Math.sqrt(
          playerVelocity.x ** 2 + playerVelocity.y ** 2
        );
        if (magnitude > 0) {
          playerVelocity.x /= magnitude;
          playerVelocity.y /= magnitude;
        }
      });

      document.addEventListener("keyup", (e) => {
        keys[e.key] = false;

        playerVelocity.x = 0;
        playerVelocity.y = 0;

        if (keys["ArrowUp"] || keys["w"]) playerVelocity.y -= 1;
        if (keys["ArrowDown"] || keys["s"]) playerVelocity.y += 1;
        if (keys["ArrowLeft"] || keys["a"]) playerVelocity.x -= 1;
        if (keys["ArrowRight"] || keys["d"]) playerVelocity.x += 1;

        const magnitude = Math.sqrt(
          playerVelocity.x ** 2 + playerVelocity.y ** 2
        );
        if (magnitude > 0) {
          playerVelocity.x /= magnitude;
          playerVelocity.y /= magnitude;
        }
      });

      generateNewMaze();
      animate();
    </script>
  </body>
</html>
